modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/KodaNotABear/Simulacra/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/KodaNotABear/Simulacra"
logoFile="logo.png"
credits="The Create team, and Deep Mob Learning and Hostile Neural Networks for the 'train a model, simulate the mob' loop this builds on."
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="${create_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="flywheel"
    type="required"
    versionRange="${flywheel_version_range}"
    ordering="AFTER"
    side="CLIENT"

# Ponder ships with Create, but the scenes are ours and load client-side, so declare it.
[[dependencies.${mod_id}]]
    modId="ponder"
    type="required"
    versionRange="${ponder_version_range}"
    ordering="AFTER"
    side="CLIENT"
